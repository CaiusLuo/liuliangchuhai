[project]
name = "liuliangchuhai-api"
version = "0.1.0"
description = "Phase 0 API architecture and provider extension points"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liuliangchuhai"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "import-linter>=2.3,<3",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/liuliangchuhai"]

[tool.importlinter]
root_package = "liuliangchuhai"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "forbidden"
source_modules = ["liuliangchuhai.domain"]
forbidden_modules = [
    "liuliangchuhai.application",
    "liuliangchuhai.infrastructure",
    "liuliangchuhai.presentation",
    "liuliangchuhai.bootstrap",
    "fastapi",
    "pydantic",
    "pydantic_settings",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Application does not depend on outer layers"
type = "forbidden"
source_modules = ["liuliangchuhai.application"]
forbidden_modules = [
    "liuliangchuhai.infrastructure",
    "liuliangchuhai.presentation",
    "liuliangchuhai.bootstrap",
    "fastapi",
    "pydantic",
    "pydantic_settings",
    "httpx",
]
